<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="3DPit.ico" />
    <title>3DPitSimu</title>

    <link rel="stylesheet" href="css/simulator.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/repl-panel.css">
    <link rel="stylesheet" href="css/led-colors.css">
    <link rel="stylesheet" href="css/simulation-lock.css">
    <link rel="stylesheet" href="css/project-drawer.css">
    <link rel="stylesheet" href="css/tutorial.css">
    <link rel="stylesheet" href="css/report-generator.css">
    <link rel="stylesheet" href="css/annotations.css">
    <link rel="stylesheet" href="css/blockly-panel.css">

    <link rel="stylesheet" href="lib/xterm/xterm.css">
    <link rel="stylesheet" href="lib/codemirror/codemirror.css">
    <link rel="stylesheet" href="lib/codemirror/dracula.css">

</head>

<body>

    <!-- ====================================================== -->
    <!-- BARRA SUPERIOR                                         -->
    <!-- ====================================================== -->

    <header id="toolbar">

        <div class="logo">

            <button id="btnProjectMenu" class="btn-project-toggle" title="Proyecto: nuevo, guardar, abrir...">
                <span class="project-toggle-icon">☰</span>
            </button>

            <div id="tutorialSelector" class="tutorial-selector">
                <button id="btnTutorial" class="btn-project-toggle" title="Tutoriales paso a paso">🎓</button>
                <div id="tutorialMenu" class="tutorial-menu hidden"></div>
            </div>

            <h2>3DPitSim</h2>
            <span>v0.1</span>
            <input id="currentFileLabel" class="current-file-label" type="text" title="Nombre del proyecto -- se usa al Guardar/Guardar como" value="Sin guardar" spellcheck="false">
            <span id="currentFileLabelDirty" class="current-file-label-dirty" title="Cambios sin guardar">•</span>
            <button id="btnBlockly" class="btn-project-toggle" title="Editor de bloques (armar el código arrastrando bloques)">🧩</button>
            <button id="btnGenerateReport" class="btn-project-toggle" title="Generar reporte de la práctica (SVG)">📄</button>

            <div id="projectDrawer" class="project-drawer hidden">

                <div class="project-drawer-section">
                    <button class="project-drawer-item" id="pdNewProject">🆕 Nuevo proyecto</button>
                    <button class="project-drawer-item" id="pdOpenProject" title="Ctrl+O">📂 Abrir…</button>
                    <button class="project-drawer-item" id="pdSaveProject" title="Ctrl+S">💾 Guardar</button>
                    <button class="project-drawer-item" id="pdSaveAsProject" title="Ctrl+Shift+S">💾 Guardar como…</button>
                </div>

                <div class="project-drawer-separator"></div>

                <button class="project-drawer-item" id="pdValidate" title="Validar circuito (F12)">✓ Validar circuito</button>
                <button class="project-drawer-item" id="pdReload" title="Recargar el simulador para reiniciarlo, sin salir del navegador">🔄 Recargar</button>

            </div>

        </div>

        <div class="toolbar-buttons">
            <button id="btnCanvasTheme" class="btn-canvas-theme" title="Cambiar a fondo oscuro (noche)">🌙</button>
            <!-- Botón 🌐 (modo navegador/WASM) oculto a propósito -- no se
                 va a usar por ahora (se prioriza el puente local para
                 GitHub Pages, ver desktop/README_puente.md). El modo en sí
                 sigue andando, solo no hay botón visible: se puede seguir
                 entrando a mano con el hash #modo=wasm, y Toolbar.
                 bindWasmModeToggle() ya tiene un guard (if (!btn) return;)
                 así que no hace falta tocar nada más para restaurarlo --
                 alcanza con volver a poner esta línea:
            <button id="btnWasmModeToggle" class="btn-canvas-theme" title="Cambiar entre modo escritorio y modo navegador (experimental)">🌐</button>
            -->
            <button id="btnSimToggle" class="btn-sim-toggle">▶ Simular</button>
        </div>

    </header>


    <!-- ====================================================== -->
    <!-- CONTENIDO                                              -->
    <!-- ====================================================== -->

    <main id="mainLayout">

        <!-- =========================================== -->
        <!-- TOOLBOX                                     -->
        <!-- =========================================== -->

        <aside id="toolbox">

            <h3>Componentes</h3>

            <div id="componentList">
                <!-- Se cargará automáticamente -->
            </div>

        </aside>


        <!-- =========================================== -->
        <!-- CANVAS                                      -->
        <!-- =========================================== -->

        <section id="workspace">

            <!-- Antes vivía como <footer> fijo abajo de TODA la ventana
                 (30px robados siempre, aunque no hubiera nada urgente
                 que avisar). Ahora es una etiqueta flotante dentro del
                 propio canvas -- el workspace recupera esos 30px de
                 alto y el mensaje de estado sigue estando visible,
                 solo que ya no le cuesta espacio permanente a nadie. -->
            <div id="statusBar">
                <span id="statusText">Listo</span>
                <span id="statusWarning" class="status-warning hidden"></span>
            </div>

            <!-- Deshacer/Rehacer + captura del circuito como imagen --
                 lado derecho arriba, ver Toolbar.bindCanvasTools() -->
            <div id="canvasTools" class="canvas-tools">
                <button id="btnScreenshot" class="canvas-tool-btn" title="Capturar el circuito como imagen"><img src="assets/icons/camera.png" alt="Screenshot"></button>
                <button id="btnUndo" class="canvas-tool-btn" title="Deshacer (Ctrl+Z)"><img src="assets/icons/undo.png" alt="Deshacer"></button>
                <button id="btnRedo" class="canvas-tool-btn" title="Rehacer (Ctrl+Y)"><img src="assets/icons/redo.png" alt="Rehacer"></button>
                <button id="btnAddAnnotation" class="canvas-tool-btn" title="Agregar una nota al lienzo (info, tip, problema o advertencia)">🏷️</button>
            </div>

            <svg id="simulatorCanvas">

                <!-- Cuadrícula -->
                <g id="gridLayer"></g>

                <!-- Vista (zoom / paneo) -->
                <g id="viewport">

                    <!-- Componentes -->
                    <g id="componentLayer"></g>

                    <!-- Cables -->
                    <g id="wireLayer"></g>

                    <!-- Selección -->
                    <g id="selectionLayer"></g>

                    <!-- Notas del lienzo (ver AnnotationManager.js) -- arriba
                         de todo a propósito, para que nunca queden tapadas
                         por un componente/cable. -->
                    <g id="annotationLayer"></g>

                </g>

            </svg>

        </section>


        <!-- =========================================== -->
        <!-- PANEL DERECHO                               -->
        <!-- =========================================== -->

        <aside id="propertyPanel">

            <h3>
                Propiedades
                <button id="btnPinPanel" class="panel-pin-btn" title="Fijar panel">📌</button>
            </h3>

            <div id="propertyContent">
                Ningún componente seleccionado.
            </div>

        </aside>

        <!-- Pestaña para reabrir el panel cuando está colapsado -->
        <button id="propsReopenTab" title="Mostrar propiedades">◀ Propiedades</button>

    </main>


    <!-- ====================================================== -->
    <!-- LIBRERÍAS DEL MOTOR                                    -->
    <!-- ====================================================== -->

    <script src="js/simulator/Utils.js"></script>
    <script src="js/simulator/EventBus.js"></script>
    <script src="js/simulator/ComponentBehaviorRegistry.js"></script>
    <script src="js/simulator/Component.js"></script>
    <script src="js/simulator/ComponentManager.js"></script>
    <script src="js/simulator/SelectionManager.js"></script>
    <script src="js/simulator/DragManager.js"></script>
    <script src="js/simulator/WireManager.js"></script>
    <script src="js/simulator/SignalEngine.js"></script>
    <script src="js/simulator/FrozenHalTypes.js"></script>
    <script src="js/simulator/QemuBridge.js"></script>
    <script src="js/simulator/WasmBridge.js"></script>
    <script src="js/simulator/Renderer.js"></script>
    <script src="js/simulator/HistoryManager.js"></script>
    <script src="js/simulator/AnnotationManager.js"></script>
    <script src="js/simulator/ProjectManager.js"></script>
    <script src="js/simulator/ValidationEngine.js"></script>
    <script src="js/simulator/Simulator.js"></script>


    <!-- ====================================================== -->
    <!-- LIBRERÍAS DE TERCEROS                                  -->
    <!-- ====================================================== -->

    <script src="lib/xterm/xterm.js"></script>
    <script src="lib/xterm/xterm-addon-fit.js"></script>
    <script src="lib/xterm/xterm-addon-links.js"></script>
    <script src="lib/codemirror/codemirror.js"></script>
    <script src="lib/codemirror/lang-python.js"></script>
    <script src="lib/jspdf/jspdf.umd.min.js"></script>

    <!-- Blockly (editor de bloques) -- v6.20210701.0, portado de
         AppBlock3 tal cual (generadores en el namespace global
         Blockly.Python[tipo], no la API de clases de v9+). Orden
         importa: core -> idioma -> contenido de bloques/generadores. -->
    <script src="lib/blockly/blockly_compressed.js"></script>
    <script src="lib/blockly/blocks_compressed.js"></script>
    <script src="lib/blockly/python_compressed.js"></script>
    <script src="lib/blockly/msg/es.js"></script>
    <script src="js/blockly/field_slider.js"></script>
    <script src="js/blockly/blocks.js"></script>
    <script src="js/blockly/generators.js"></script>
    <script src="js/blockly/toolbox.js"></script>
    <script src="js/blockly/canvasButtons.js"></script>


    <!-- ====================================================== -->
    <!-- INTERFAZ                                               -->
    <!-- ====================================================== -->

    <script src="js/ui/Toolbar.js"></script>
    <script src="js/ui/Toolbox.js"></script>
    <script src="js/ui/PropertyPanel.js"></script>
    <script src="js/ui/ReplPanel.js"></script>
    <script src="js/ui/ContextMenu.js"></script>
    <script src="js/ui/TutorialManager.js"></script>
    <script src="js/ui/ReportGenerator.js"></script>
    <script src="js/ui/BlocklyPanel.js"></script>


    <!-- ====================================================== -->
    <!-- APP                                                    -->
    <!-- ====================================================== -->

    <script src="js/app.js"></script>

</body>

</html>
