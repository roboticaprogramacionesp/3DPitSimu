<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40mm" height="36mm">

    <!-- Lector RC522 (RFID 13.56MHz, SPI). Antena dibujada como
         cuadrados anidados (misma idea visual que la bobina espiral
         real, simplificada a trazos concéntricos). Pines en el borde
         inferior, orden real de silkscreen: SDA, SCK, MOSI, MISO, IRQ,
         GND, RST, 3.3V. -->

    <rect x="2" y="2" width="36" height="32" rx="2" fill="#12385e" />

    <rect x="6" y="5" width="22" height="22" rx="1" fill="none" stroke="#c0a060" stroke-width="1.2" />
    <rect x="9" y="8" width="16" height="16" rx="1" fill="none" stroke="#c0a060" stroke-width="1.2" />
    <rect x="12" y="11" width="10" height="10" rx="1" fill="none" stroke="#c0a060" stroke-width="1.2" />
    <circle cx="17" cy="16" r="1" fill="#c0a060" />

    <rect x="29" y="6" width="7" height="7" fill="#1a1a1a" />

    <text x="17" y="30.5" fill="#ffffff" font-size="2.6" font-weight="bold" text-anchor="middle" font-family="sans-serif">RC522</text>

    <g fill="#8c8c8c">
        <circle cx="4.5"  cy="33" r="1.3" />
        <circle cx="9"    cy="33" r="1.3" />
        <circle cx="13.5" cy="33" r="1.3" />
        <circle cx="18"   cy="33" r="1.3" />
        <circle cx="22.5" cy="33" r="1.3" />
        <circle cx="27"   cy="33" r="1.3" />
        <circle cx="31.5" cy="33" r="1.3" />
        <circle cx="36"   cy="33" r="1.3" />
    </g>

    <g fill="#ffffff" font-size="1.8" font-family="sans-serif" text-anchor="middle">
        <text x="4.5"  y="30.2">SDA</text>
        <text x="9"    y="30.2">SCK</text>
        <text x="13.5" y="30.2">MOSI</text>
        <text x="18"   y="30.2">MISO</text>
        <text x="22.5" y="30.2">IRQ</text>
        <text x="27"   y="30.2">GND</text>
        <text x="31.5" y="30.2">RST</text>
        <text x="36"   y="30.2">3V3</text>
    </g>

</svg>
