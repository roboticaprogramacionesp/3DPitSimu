<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 30" width="56mm" height="30mm">

    <!-- Interruptor deslizante SPDT (NC / COM / NO). Mismo criterio
         visual que switch.svg (un solo lever que se corre), pero acá
         a 3 posiciones de terminal: el lever se corre a la IZQUIERDA
         (sobre NC, com puenteado a nc) o a la DERECHA (sobre NO, com
         puenteado a no), nunca queda "al medio" ni desconectado,
         igual que un deslizante real de 3 patitas. data-role=
         "spdt-lever" es lo que slide_switch.behavior.js corre;
         data-role="spdt-hitzone" es la zona de click (con el mismo
         fix de isRunning que switch.behavior.js, para poder
         seleccionar/arrastrar el componente entero mientras no esté
         corriendo la simulación). -->

    <rect x="3" y="4" width="50" height="14" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5" />
    <rect x="7" y="7" width="42" height="8" rx="4" fill="#111111" />

    <rect data-role="spdt-lever" x="7" y="7" width="18" height="8" rx="4" fill="#cccccc" />

    <!-- Cables de salida hacia los pines nc/com/no -->
    <path d="M 8,18 L 4,20"  fill="none" stroke="#666666" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 28,18 L 28,20" fill="none" stroke="#666666" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 48,18 L 52,20" fill="none" stroke="#666666" stroke-width="1.6" stroke-linecap="round" />
    <rect x="2.5"  y="20.5" width="3" height="3" fill="#e0c040" />
    <rect x="26.5" y="20.5" width="3" height="3" fill="#e0c040" />
    <rect x="50.5" y="20.5" width="3" height="3" fill="#e0c040" />

    <!-- Fondo oscuro detrás de las etiquetas (a diferencia de switch.svg,
         acá SÍ hacen falta ya que 3 terminales sin nombre serían
         ambiguos) para que el texto blanco no quede invisible sobre
         el fondo claro del canvas, mismo fix que rc522_real.svg. -->
    <g fill="#12385e" opacity="0.85">
        <rect x="0.5"  y="24.5" width="8" height="4" />
        <rect x="24.5" y="24.5" width="8" height="4" />
        <rect x="47.5" y="24.5" width="8" height="4" />
    </g>
    <g fill="#ffffff" font-size="3" font-family="sans-serif" text-anchor="middle">
        <text x="4.5"  y="27.6">NC</text>
        <text x="28.5" y="27.6">COM</text>
        <text x="51.5" y="27.6">NO</text>
    </g>

    <!-- Zona de click generosa sobre todo el cuerpo -->
    <rect data-role="spdt-hitzone" x="2" y="2" width="52" height="20" fill="transparent" style="cursor:pointer" />

</svg>
