const PRISM_POINTS = {
  F1: [20, 165], F2: [140, 165], F3: [80, 85],
  B1: [70, 115], B2: [190, 115], B3: [130, 35]
};
const PRISM_FACES = [
  { name: 'Base 1 (triángulo)', pts: ['F1', 'F2', 'F3'], color: '#ec4899' },
  { name: 'Base 2 (triángulo)', pts: ['B1', 'B2', 'B3'], color: '#ec4899' },
  { name: 'Cara lateral 1', pts: ['F1', 'F2', 'B2', 'B1'], color: '#4f46e5' },
  { name: 'Cara lateral 2', pts: ['F2', 'F3', 'B3', 'B2'], color: '#4f46e5' },
  { name: 'Cara lateral 3', pts: ['F3', 'F1', 'B1', 'B3'], color: '#4f46e5' }
];
const PRISM_EDGES = [
  ['F1', 'F2'], ['F2', 'F3'], ['F3', 'F1'],
  ['B1', 'B2'], ['B2', 'B3'], ['B3', 'B1'],
  ['F1', 'B1'], ['F2', 'B2'], ['F3', 'B3']
];
const PRISM_VERTICES = ['F1', 'F2', 'F3', 'B1', 'B2', 'B3'];

function renderPrismSVG() {
  const drawOrder = PRISM_FACES.slice(2).concat(PRISM_FACES.slice(0, 2));
  const facesSvg = drawOrder.map(f => {
    const pts = f.pts.map(n => PRISM_POINTS[n].join(',')).join(' ');
    return `<polygon points="${pts}" fill="${f.color}" fill-opacity="0.4" stroke="${f.color}" stroke-width="2"/>`;
  }).join('');
  const vertsSvg = Object.values(PRISM_POINTS).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="#3730a3"/>`).join('');
  return `<svg viewBox="0 0 210 175" xmlns="http://www.w3.org/2000/svg">${facesSvg}${vertsSvg}</svg>`;
}

function drawPrismWireframeBase(ctx) {
  ctx.strokeStyle = '#c7d2fe';
  ctx.lineWidth = 2;
  PRISM_EDGES.forEach(([a, b]) => {
    const [x1, y1] = PRISM_POINTS[a];
    const [x2, y2] = PRISM_POINTS[b];
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });
  Object.values(PRISM_POINTS).forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#c7d2fe';
    ctx.fill();
  });
}

function drawPrismFace(ctx, ptNames, color) {
  ctx.beginPath();
  ptNames.forEach((name, i) => {
    const [x, y] = PRISM_POINTS[name];
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = color;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawPrismEdge(ctx, edge, color) {
  const [x1, y1] = PRISM_POINTS[edge[0]];
  const [x2, y2] = PRISM_POINTS[edge[1]];
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.stroke();
}

function drawPrismVertex(ctx, name, color) {
  const [x, y] = PRISM_POINTS[name];
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawPrismFrame(ctx, w, h, step) {
  ctx.save();
  ctx.translate((w - 210) / 2, 10);
  drawPrismWireframeBase(ctx);

  let label = '';
  if (step < 5) {
    const face = PRISM_FACES[step];
    drawPrismFace(ctx, face.pts, face.color);
    label = 'Caras: ' + (step + 1) + ' / 5 — ' + face.name;
  } else if (step < 14) {
    drawPrismEdge(ctx, PRISM_EDGES[step - 5], '#f59e0b');
    label = 'Aristas: ' + (step - 5 + 1) + ' / 9';
  } else if (step < 20) {
    drawPrismVertex(ctx, PRISM_VERTICES[step - 14], '#10b981');
    label = 'Vértices: ' + (step - 14 + 1) + ' / 6';
  } else {
    PRISM_FACES.slice(2).concat(PRISM_FACES.slice(0, 2)).forEach(f => drawPrismFace(ctx, f.pts, f.color));
    PRISM_EDGES.forEach(e => drawPrismEdge(ctx, e, '#f59e0b'));
    PRISM_VERTICES.forEach(v => drawPrismVertex(ctx, v, '#10b981'));
    label = '5 + 6 = 9 + 2 → 11 = 11 ✓';
  }
  ctx.restore();
  return label;
}

function renderDragItemCard(item, maxN) {
  return `
    <div class="drag-item" onpointerdown="beginDrag(event, ${item.id})">
      <div class="fig-svg">${renderMiniFigureSVG(item.squares, maxN)}</div>
      <div class="fig-label">Figura ?</div>
    </div>
  `;
}

function renderDragActivity(interactive) {
  const maxN = Math.max(...interactive.items.map(it => it.squares));
  const slotsHtml = interactive.correctOrder.map((_, i) => {
    const itemId = state.dragOrder[i];
    const item = (itemId !== null && itemId !== undefined) ? interactive.items.find(it => it.id === itemId) : null;
    return `
      <div class="drag-slot ${item ? 'filled' : ''}" data-slot-index="${i}">
        <span class="slot-label">${i + 1}º</span>
        ${item ? renderDragItemCard(item, maxN) : ''}
      </div>
    `;
  }).join('');
  const poolHtml = state.dragPool.map(id => {
    const item = interactive.items.find(it => it.id === id);
    return item ? renderDragItemCard(item, maxN) : '';
  }).join('');
  return `
    <div class="drag-activity">
      <p class="drag-instructions">🧩 ${interactive.instructions}</p>
      <div class="drag-slots">${slotsHtml}</div>
      <div class="drag-pool">${poolHtml}</div>
      ${state.dragSolved ? '<div class="drag-feedback ok">🎉 ¡Perfecto! Las ordenaste correctamente de menor a mayor.</div>' : ''}
    </div>
  `;
}

function checkDragComplete() {
  const level = getCurrentLevel();
  if (!level || !level.interactive) return;
  const order = state.dragOrder;
  if (order.some(v => v === null || v === undefined)) {
    state.dragSolved = false;
    return;
  }
  const correct = level.interactive.correctOrder;
  state.dragSolved = order.length === correct.length && order.every((v, i) => v === correct[i]);
}

function placeItemInSlot(itemId, slotIndex) {
  const order = state.dragOrder;
  if (order[slotIndex] !== null && order[slotIndex] !== undefined && order[slotIndex] !== itemId) return;
  const prevSlot = order.indexOf(itemId);
  if (prevSlot !== -1) order[prevSlot] = null;
  state.dragPool = state.dragPool.filter(id => id !== itemId);
  order[slotIndex] = itemId;
  checkDragComplete();
}

function returnItemToPool(itemId) {
  const order = state.dragOrder;
  const prevSlot = order.indexOf(itemId);
  if (prevSlot !== -1) order[prevSlot] = null;
  if (!state.dragPool.includes(itemId)) state.dragPool.push(itemId);
  checkDragComplete();
}

function beginDrag(evt, itemId) {
  evt.preventDefault();
  const srcEl = evt.currentTarget;
  const rect = srcEl.getBoundingClientRect();
  const ghost = srcEl.cloneNode(true);
  ghost.classList.add('drag-ghost-el');
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.pointerEvents = 'none';
  ghost.style.transform = 'scale(1.05) rotate(-2deg)';
  document.body.appendChild(ghost);
  srcEl.classList.add('dragging');

  const offsetX = evt.clientX - rect.left;
  const offsetY = evt.clientY - rect.top;

  function onMove(e) {
    ghost.style.left = (e.clientX - offsetX) + 'px';
    ghost.style.top = (e.clientY - offsetY) + 'px';
  }
  function onUp(e) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    ghost.remove();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const slot = el ? el.closest('.drag-slot') : null;
    if (slot) {
      placeItemInSlot(itemId, parseInt(slot.dataset.slotIndex, 10));
    } else {
      returnItemToPool(itemId);
    }
    render();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function renderStepEntender(level) {
  const steps = level.entender.steps;
  const idx = state.entenderIdx;
  const totalPages = steps.length + 1;
  const showFormula = idx >= steps.length;
  const lastVisibleStep = Math.min(idx, steps.length - 1);

  let stepsHtml = '';
  for (let i = 0; i <= lastVisibleStep; i++) {
    const isActive = i === idx;
    stepsHtml += isActive ? `
      <div class="explanation-step-big">
        <div class="step-num-badge">${i + 1}</div>
        <div>${steps[i]}</div>
      </div>
    ` : `
      <div class="explanation-step-done">
        <div class="step-num-badge small">${i + 1}</div>
        <div>${steps[i]}</div>
      </div>
    `;
  }

  const meaning = level.entender.formulaMeaning || [];
  const legendOpen = state.formulaLegendOpen;
  const formulaHtml = showFormula ? `
    <div class="formula-card">
      ${level.entender.formulaLabel ? `<p class="formula-label">${level.entender.formulaLabel}</p>` : ''}
      <div class="formula-expr" ${meaning.length ? 'onclick="toggleFormulaLegend()"' : ''}>
        ${nl2br(level.entender.formula)}
        ${meaning.length ? `<span class="formula-toggle-hint">${legendOpen ? '▲ Ocultar qué significa cada letra' : '▼ ¿Qué significa cada letra?'}</span>` : ''}
      </div>
      ${(meaning.length && legendOpen) ? `
        <ul class="formula-legend">
          ${meaning.map(m => `<li><span class="sym">${m.symbol}:</span> ${m.text}</li>`).join('')}
        </ul>
      ` : ''}
    </div>
  ` : '';

  const roboticaHtml = (showFormula && level.robotica) ? `
    <div class="robotica-card"><strong>🤖 Conexión con la robótica</strong>${level.robotica}</div>
  ` : '';

  return `
    <h2 class="step-title">${level.entender.title}</h2>
    <p class="step-subtitle">Paso ${Math.min(idx + 1, totalPages)} de ${totalPages}</p>
    <div class="explanation-list">${stepsHtml}</div>
    ${formulaHtml}
    ${roboticaHtml}
    <div class="step-nav-row" style="align-items:center;">
      <button class="step-arrow-btn" onclick="entenderPrev()" aria-label="Paso anterior" ${idx === 0 ? 'disabled' : ''}>←</button>
      <button class="step-arrow-btn" onclick="${showFormula ? 'continueFromEntender()' : 'entenderNext()'}" aria-label="Siguiente paso">→</button>
    </div>
  `;
}

function getPalilloLines(n) {
  const squareSize = 46;
  const lines = [];
  for (let i = 0; i < n; i++) {
    const x = i * squareSize;
    if (i === 0) lines.push({ x1: x, y1: 0, x2: x, y2: squareSize, step: 1 });
    lines.push({ x1: x + squareSize, y1: 0, x2: x + squareSize, y2: squareSize, step: i + 1 });
    lines.push({ x1: x, y1: 0, x2: x + squareSize, y2: 0, step: i + 1 });
    lines.push({ x1: x, y1: squareSize, x2: x + squareSize, y2: squareSize, step: i + 1 });
  }
  return lines;
}

function drawProgresionFrame(ctx, w, h, step) {
  const squareSize = 46;
  const lines = getPalilloLines(step);
  const totalWidth = squareSize * step;
  const offsetX = (w - totalWidth) / 2;
  const offsetY = (h - squareSize) / 2 - 10;
  ctx.lineCap = 'round';
  lines.forEach(l => {
    ctx.lineWidth = l.step === step ? 6 : 4;
    ctx.strokeStyle = l.step === step ? '#f59e0b' : '#4f46e5';
    ctx.beginPath();
    ctx.moveTo(offsetX + l.x1, offsetY + l.y1);
    ctx.lineTo(offsetX + l.x2, offsetY + l.y2);
    ctx.stroke();
  });
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#1e293b';
  ctx.textAlign = 'center';
  ctx.fillText('Figura ' + step, w / 2, offsetY + squareSize + 32);
  return (4 + (step - 1) * 3) + ' palillos (Figura ' + step + ')';
}

// ===================== MOTOR GENÉRICO DE SIMULACIONES =====================
// Cada "kind" define: canvasHeight, initFrame, maxStep, interval y una función
// draw(ctx, w, h, step, level) que dibuja el frame y devuelve el texto del contador.
const SIM_REGISTRY = {
  progresion: { canvasHeight: 180, initFrame: 1, maxStep: 10, interval: 550, initialCounter: '4 palillos (Figura 1)', draw: drawProgresionFrame },
  prisma: { canvasHeight: 210, initFrame: 0, maxStep: 20, interval: 500, initialCounter: 'Caras: 1 / 5 — Base 1 (triángulo)', draw: drawPrismFrame },
  progresionCuadratica: { canvasHeight: 190, initFrame: 1, maxStep: 5, interval: 650, initialCounter: '1 cuadrado (Figura 1)', draw: drawCuadraticaFrame },
  numberlineSort: { canvasHeight: 170, initFrame: 1, maxStepFn: level => level.simular.data.values.length, interval: 700, initialCounter: 'Ordenando...', draw: drawNumberlineSortFrame },
  numberlineMedian: { canvasHeight: 170, initFrame: 0, maxStepFn: level => Math.floor((level.simular.data.values.length - 1) / 2), interval: 800, initialCounter: 'Descartando extremos...', draw: drawNumberlineMedianFrame },
  numberlineDispersion: { canvasHeight: 190, initFrame: 0, maxStep: 3, interval: 800, initialCounter: 'Comparando grupos...', draw: drawNumberlineDispersionFrame },
  numberlineMean: { canvasHeight: 170, initFrame: 0, maxStep: 12, interval: 90, initialCounter: 'Calculando el promedio...', draw: drawNumberlineMeanFrame },
  barchart: { canvasHeight: 200, initFrame: 0, maxStepFn: level => Math.max(...Object.values(level.simular.data.values.reduce((acc, v) => { acc[v] = (acc[v] || 0) + 1; return acc; }, {}))) + 1, interval: 500, initialCounter: 'Contando frecuencias...', draw: drawBarchartFrame },
  mapping: { canvasHeight: 210, initFrame: 1, maxStepFn: level => level.simular.data.pairs.length, interval: 700, initialCounter: 'Trazando relaciones...', draw: drawMappingFrame },
  graph: { canvasHeight: 220, initFrame: 0, maxStepFn: level => level.simular.data.curves.length * 10 + 10, interval: 60, initialCounter: 'Trazando...', draw: drawGraphFrame },
  solveReveal: { canvasHeight: 170, initFrame: 0, maxStepFn: level => level.simular.data.targets.length * 10, interval: 90, initialCounter: 'Resolviendo...', draw: drawSolveRevealFrame },
  euclid: { canvasHeight: 220, initFrame: 1, maxStepFn: level => computeEuclidSquares(level.simular.data.a, level.simular.data.b).length, interval: 650, initialCounter: 'Colocando cuadrados...', draw: drawEuclidFrame },
  signSteps: { canvasHeight: 200, initFrame: 1, maxStepFn: level => level.simular.data.terms.length, interval: 800, initialCounter: 'Sumando: 0...', draw: drawSignStepsFrame },
  polygonAngles: { canvasHeight: 220, initFrame: 0, maxStepFn: level => level.simular.data.n - 2, interval: 700, initialCounter: 'Triangulando... 0°', draw: drawPolygonAnglesFrame },
  perimeterTrace: { canvasHeight: 200, initFrame: 1, maxStep: 3, interval: 700, initialCounter: 'Sumando lados...', draw: drawPerimeterTraceFrame },
  rectAreaPerim: { canvasHeight: 220, initFrame: 1, maxStepFn: level => level.simular.data.height + 1, interval: 450, initialCounter: 'Rellenando filas...', draw: drawRectAreaPerimFrame },
  metricLadder: { canvasHeight: 260, initFrame: 0, maxStepFn: level => Math.abs(METRIC_UNITS.indexOf(level.simular.data.toUnit) - METRIC_UNITS.indexOf(level.simular.data.fromUnit)), interval: 700, initialCounter: 'Convirtiendo...', draw: drawMetricLadderFrame },
  triangleClassify: { canvasHeight: 220, initFrame: 1, maxStep: 3, interval: 800, initialCounter: 'Dibujando el triángulo...', draw: drawTriangleClassifyFrame }
};

function simMaxStep(level) {
  const cfg = SIM_REGISTRY[level.simular.kind];
  return cfg.maxStepFn ? cfg.maxStepFn(level) : cfg.maxStep;
}

function simDraw(level, step) {
  const canvas = document.getElementById('sim-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cfg = SIM_REGISTRY[level.simular.kind];
  const label = cfg.draw(ctx, w, h, step, level);
  const counterEl = document.getElementById('sim-counter');
  if (counterEl && label) counterEl.textContent = label;
}

let simInterval = null;
function playSimulation() {
  if (simInterval) return;
  const level = getCurrentLevel();
  if (!level || !level.simular) return;
  const cfg = SIM_REGISTRY[level.simular.kind];
  const maxStep = simMaxStep(level);
  const btn = document.getElementById('sim-play-btn');
  if (btn) btn.disabled = true;
  let step = cfg.initFrame;
  simDraw(level, step);
  simInterval = setInterval(() => {
    step++;
    const canvas = document.getElementById('sim-canvas');
    if (step > maxStep || !canvas) {
      clearInterval(simInterval);
      simInterval = null;
      if (btn) btn.disabled = false;
      return;
    }
    simDraw(level, step);
  }, cfg.interval);
}

function renderStepSimular(level) {
  const cfg = SIM_REGISTRY[level.simular.kind];
  return `
    <h2 class="step-title">${level.simular.title}</h2>
    <p class="step-subtitle">${level.simular.description}</p>
    <div class="sim-wrap">
      <canvas id="sim-canvas" class="sim-canvas" width="600" height="${cfg.canvasHeight}"></canvas>
      <div class="sim-counter" id="sim-counter">${cfg.initialCounter}</div>
      <button class="btn mt-2" id="sim-play-btn" onclick="playSimulation()">▶️ Reproducir simulación</button>
    </div>
    <div class="step-nav-row" style="justify-content:flex-end;">
      <button class="btn" onclick="continueFromSimular()">Continuar →</button>
    </div>
  `;
}

// ----- kind: progresionCuadratica -----
function drawCuadraticaFrame(ctx, w, h, step) {
  const n = step;
  const cell = Math.min(28, Math.floor((Math.min(w, h) - 60) / n));
  const totalSize = cell * n;
  const offsetX = (w - totalSize) / 2;
  const offsetY = (h - totalSize) / 2 - 10;
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const isNew = (r === n - 1 || c === n - 1);
      ctx.fillStyle = isNew ? 'rgba(245,158,11,0.35)' : 'rgba(79,70,229,0.15)';
      ctx.strokeStyle = isNew ? '#f59e0b' : '#4f46e5';
      ctx.lineWidth = isNew ? 3 : 2;
      const x = offsetX + c * cell, y = offsetY + r * cell;
      ctx.fillRect(x, y, cell, cell);
      ctx.strokeRect(x, y, cell, cell);
    }
  }
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#1e293b';
  ctx.textAlign = 'center';
  ctx.fillText('Figura ' + n + ' → ' + n + '×' + n + ' = ' + (n * n) + ' cuadrados', w / 2, offsetY + totalSize + 28);
  return (n * n) + ' cuadrados (Figura ' + n + ')';
}

// ----- utilidades de recta numérica -----
function nlMapX(value, min, max, w, margin) {
  const span = (max - min) || 1;
  return margin + ((value - min) / span) * (w - margin * 2);
}

function drawNumberLineBase(ctx, w, h, min, max, margin) {
  const y = h / 2 + 10;
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(margin, y);
  ctx.lineTo(w - margin, y);
  ctx.stroke();
  return y;
}

// ----- kind: numberlineSort (ordenar números/fracciones/decimales) -----
function drawNumberlineSortFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const values = data.values;
  const labels = data.labels || values.map(v => String(v));
  const sortedIdx = values.map((v, i) => i).sort((a, b) => values[a] - values[b]);
  const min = Math.min(...values), max = Math.max(...values);
  const pad = ((max - min) || 1) * 0.15;
  const margin = 40;
  const y = drawNumberLineBase(ctx, w, h, min - pad, max + pad, margin);
  const visibleCount = Math.min(step, values.length);
  sortedIdx.forEach((origIdx, order) => {
    if (order >= visibleCount) return;
    const v = values[origIdx];
    const x = nlMapX(v, min - pad, max + pad, w, margin);
    const isLatest = order === visibleCount - 1;
    ctx.beginPath();
    ctx.arc(x, y, isLatest ? 9 : 7, 0, Math.PI * 2);
    ctx.fillStyle = isLatest ? '#f59e0b' : '#4f46e5';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[origIdx], x, y - 16);
  });
  const orderedLabels = sortedIdx.slice(0, visibleCount).map(i => labels[i]);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#334155';
  ctx.textAlign = 'center';
  ctx.fillText(orderedLabels.join('  <  '), w / 2, h - 14);
  return 'Orden: ' + orderedLabels.join(' < ');
}

// ----- kind: numberlineMedian (mediana, pares e impares) -----
function drawNumberlineMedianFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const values = [...data.values].sort((a, b) => a - b);
  const n = values.length;
  const min = values[0], max = values[n - 1];
  const pad = ((max - min) || 1) * 0.15 || 1;
  const margin = 40;
  const y = drawNumberLineBase(ctx, w, h, min - pad, max + pad, margin);
  const k = step;
  for (let i = 0; i < n; i++) {
    const v = values[i];
    const x = nlMapX(v, min - pad, max + pad, w, margin);
    const eliminated = i < k || i >= n - k;
    ctx.beginPath();
    ctx.arc(x, y, eliminated ? 6 : 9, 0, Math.PI * 2);
    ctx.fillStyle = eliminated ? '#cbd5e1' : '#f59e0b';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = eliminated ? '#94a3b8' : '#1e293b';
    ctx.font = (eliminated ? '' : 'bold ') + '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(v), x, y - 16);
  }
  const remaining = values.slice(k, n - k);
  const median = remaining.length === 1 ? remaining[0] : (remaining[0] + remaining[1]) / 2;
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#92400e';
  ctx.textAlign = 'center';
  ctx.fillText('Mediana = ' + median, w / 2, h - 14);
  return 'Quedan: ' + remaining.join(', ') + ' → mediana = ' + median;
}

// ----- kind: numberlineDispersion (comparar rango de 2 grupos) -----
function drawNumberlineDispersionFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const groups = [data.groupA, data.groupB];
  const allValues = groups.flatMap(g => g.values);
  const min = Math.min(...allValues), max = Math.max(...allValues);
  const pad = ((max - min) || 1) * 0.15 || 1;
  const margin = 50;
  const rowH = 70;
  const showGroup = [step >= 0, step >= 2];
  const showBracket = [step >= 1, step >= 3];
  groups.forEach((g, gi) => {
    if (!showGroup[gi]) return;
    const y = 40 + gi * rowH;
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(margin, y); ctx.lineTo(w - margin, y); ctx.stroke();
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#334155'; ctx.textAlign = 'left';
    ctx.fillText(g.label, 4, y + 4);
    ctx.textAlign = 'center';
    g.values.forEach(v => {
      const x = nlMapX(v, min - pad, max + pad, w, margin);
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fillStyle = gi === 0 ? '#4f46e5' : '#ec4899';
      ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    });
    if (showBracket[gi]) {
      const gmin = Math.min(...g.values), gmax = Math.max(...g.values);
      const x1 = nlMapX(gmin, min - pad, max + pad, w, margin);
      const x2 = nlMapX(gmax, min - pad, max + pad, w, margin);
      ctx.strokeStyle = gi === 0 ? '#4f46e5' : '#ec4899';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y + 16); ctx.lineTo(x2, y + 16); ctx.stroke();
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('rango = ' + (gmax - gmin), (x1 + x2) / 2, y + 30);
    }
  });
  if (step >= 3) {
    const rangeA = Math.max(...groups[0].values) - Math.min(...groups[0].values);
    const rangeB = Math.max(...groups[1].values) - Math.min(...groups[1].values);
    const more = rangeA < rangeB ? groups[0] : (rangeB < rangeA ? groups[1] : null);
    return more ? (more.label + ' es más homogéneo (rango ' + rangeA + ' vs ' + rangeB + ')') : ('Mismo rango: ' + rangeA);
  }
  const labels = ['Mostrando ' + groups[0].label, 'Rango de ' + groups[0].label, 'Mostrando ' + groups[1].label];
  return labels[Math.min(step, 2)];
}

// ----- kind: numberlineMean (la media converge en la recta) -----
function drawNumberlineMeanFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const values = data.values;
  const mean = values.reduce((a, b) => a + b, 0) / values.length;
  const min = Math.min(...values, mean), max = Math.max(...values, mean);
  const pad = ((max - min) || 1) * 0.2 || 1;
  const margin = 40;
  const y = drawNumberLineBase(ctx, w, h, min - pad, max + pad, margin);
  values.forEach(v => {
    const x = nlMapX(v, min - pad, max + pad, w, margin);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#4f46e5'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(v), x, y - 14);
  });
  const totalSteps = 12;
  const progress = Math.min(step / totalSteps, 1);
  const startX = nlMapX(values[0], min - pad, max + pad, w, margin);
  const targetX = nlMapX(mean, min - pad, max + pad, w, margin);
  const markerX = startX + (targetX - startX) * progress;
  ctx.beginPath();
  ctx.moveTo(markerX, y + 26); ctx.lineTo(markerX - 7, y + 40); ctx.lineTo(markerX + 7, y + 40); ctx.closePath();
  ctx.fillStyle = '#f59e0b'; ctx.fill();
  const meanText = Number.isInteger(mean) ? String(mean) : mean.toFixed(2);
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#92400e'; ctx.textAlign = 'center';
  ctx.fillText('media ≈ ' + (progress >= 1 ? meanText : '...'), markerX, y + 56);
  return progress >= 1 ? ('Media = ' + meanText) : 'Calculando el promedio...';
}

// ----- kind: barchart (moda) -----
function drawBarchartFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const values = data.values;
  const counts = {};
  values.forEach(v => counts[v] = (counts[v] || 0) + 1);
  const keys = Object.keys(counts).map(Number).sort((a, b) => a - b);
  const maxCount = Math.max(...Object.values(counts));
  const modeKey = keys.reduce((best, k) => counts[k] > counts[best] ? k : best, keys[0]);
  const margin = 40;
  const gap = (w - margin * 2) / keys.length;
  const barW = gap * 0.6;
  const baseY = h - 40;
  const maxBarH = h - 80;
  const segH = maxBarH / maxCount;
  keys.forEach((k, i) => {
    const revealed = Math.min(step, counts[k]);
    const x = margin + gap * i + (gap - barW) / 2;
    for (let c = 0; c < counts[k]; c++) {
      const filled = c < revealed;
      const y = baseY - (c + 1) * segH;
      ctx.fillStyle = filled ? (k === modeKey && step > maxCount ? '#f59e0b' : '#4f46e5') : 'rgba(79,70,229,0.12)';
      ctx.fillRect(x, y, barW, segH - 3);
    }
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#334155'; ctx.textAlign = 'center';
    ctx.fillText(String(k), x + barW / 2, baseY + 16);
  });
  ctx.strokeStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(margin, baseY); ctx.lineTo(w - margin, baseY); ctx.stroke();
  if (step > maxCount) {
    ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#92400e'; ctx.textAlign = 'center';
    ctx.fillText('Moda = ' + modeKey + ' (se repite ' + maxCount + ' veces)', w / 2, 24);
  }
  return step > maxCount ? ('Moda = ' + modeKey) : 'Contando frecuencias...';
}

// ----- kind: mapping (¿es función?) -----
function drawMappingFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const pairs = data.pairs;
  const xVals = [...new Set(pairs.map(p => p[0]))];
  const yVals = [...new Set(pairs.map(p => p[1]))];
  const leftX = w * 0.28, rightX = w * 0.72;
  const topY = 34, botY = h - 26;
  const xSpacing = (botY - topY) / (xVals.length + 1);
  const ySpacing = (botY - topY) / (yVals.length + 1);
  const xPos = {}; xVals.forEach((v, i) => xPos[v] = topY + xSpacing * (i + 1));
  const yPos = {}; yVals.forEach((v, i) => yPos[v] = topY + ySpacing * (i + 1));
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#334155';
  ctx.fillText('X', leftX, 18); ctx.fillText('Y', rightX, 18);
  xVals.forEach(v => {
    ctx.beginPath(); ctx.arc(leftX, xPos[v], 14, 0, Math.PI * 2);
    ctx.fillStyle = '#eef2ff'; ctx.fill(); ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.fillText(String(v), leftX, xPos[v] + 4);
  });
  yVals.forEach(v => {
    ctx.beginPath(); ctx.arc(rightX, yPos[v], 14, 0, Math.PI * 2);
    ctx.fillStyle = '#fdf2f8'; ctx.fill(); ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.fillText(String(v), rightX, yPos[v] + 4);
  });
  const revealed = Math.min(step, pairs.length);
  let brokenX = null;
  const seenX = {};
  for (let i = 0; i < revealed; i++) {
    const [x, y] = pairs[i];
    const isDup = seenX[x];
    seenX[x] = true;
    if (isDup) brokenX = x;
    ctx.strokeStyle = isDup ? '#ef4444' : '#10b981';
    ctx.lineWidth = isDup ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(leftX + 14, xPos[x]); ctx.lineTo(rightX - 14, yPos[y]); ctx.stroke();
  }
  let label;
  if (revealed < pairs.length) label = 'Trazando relaciones...';
  else label = data.isFunction ? '✔ Cada x tiene una única y → SÍ es función' : ('✘ x=' + brokenX + ' tiene 2 valores de y → NO es función');
  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = revealed >= pairs.length ? (data.isFunction ? '#065f46' : '#991b1b') : '#334155';
  ctx.textAlign = 'center';
  ctx.fillText(label, w / 2, h - 4);
  return label;
}

// ----- kind: graph (rectas, parábolas, circunferencias) -----
function graphMapPt(x, y, xRange, yRange, w, h, margin) {
  const px = margin + (x - xRange[0]) / (xRange[1] - xRange[0]) * (w - margin * 2);
  const py = h - margin - (y - yRange[0]) / (yRange[1] - yRange[0]) * (h - margin * 2);
  return [px, py];
}

function drawGraphAxes(ctx, w, h, xRange, yRange, margin) {
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(margin, margin, w - margin * 2, h - margin * 2);
  ctx.strokeStyle = '#cbd5e1';
  if (xRange[0] <= 0 && xRange[1] >= 0) {
    const [ox] = graphMapPt(0, 0, xRange, yRange, w, h, margin);
    ctx.beginPath(); ctx.moveTo(ox, margin); ctx.lineTo(ox, h - margin); ctx.stroke();
  }
  if (yRange[0] <= 0 && yRange[1] >= 0) {
    const [, oy] = graphMapPt(0, 0, xRange, yRange, w, h, margin);
    ctx.beginPath(); ctx.moveTo(margin, oy); ctx.lineTo(w - margin, oy); ctx.stroke();
  }
}

function drawGraphCurve(ctx, curve, xRange, yRange, w, h, margin, progress) {
  const steps = 60;
  const visibleSteps = Math.round(steps * progress);
  ctx.strokeStyle = curve.color || '#4f46e5';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i <= visibleSteps; i++) {
    let x, y;
    if (curve.type === 'circle') {
      const t = (i / steps) * Math.PI * 2;
      x = curve.cx + curve.r * Math.cos(t);
      y = curve.cy + curve.r * Math.sin(t);
    } else {
      x = xRange[0] + (xRange[1] - xRange[0]) * (i / steps);
      y = curve.type === 'line' ? (curve.m * x + curve.b) : (curve.a * x * x + curve.b * x + curve.c);
    }
    const [px, py] = graphMapPt(x, y, xRange, yRange, w, h, margin);
    if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawGraphFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const margin = 34;
  drawGraphAxes(ctx, w, h, data.xRange, data.yRange, margin);
  data.curves.forEach((curve, i) => {
    const curveStep = step - i * 10;
    const progress = Math.max(0, Math.min(curveStep / 10, 1));
    if (progress > 0) drawGraphCurve(ctx, curve, data.xRange, data.yRange, w, h, margin, progress);
  });
  const extraStep = step - data.curves.length * 10;
  let label = 'Trazando...';
  if (extraStep >= 0) {
    if (data.verticalLine) {
      const x = data.verticalLine.x;
      const [px1, py1] = graphMapPt(x, data.yRange[0], data.xRange, data.yRange, w, h, margin);
      const [px2, py2] = graphMapPt(x, data.yRange[1], data.xRange, data.yRange, w, h, margin);
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke(); ctx.setLineDash([]);
    }
    if (data.highlightPoint) {
      const { x, y, label: lbl } = data.highlightPoint;
      const [px, py] = graphMapPt(x, y, data.xRange, data.yRange, w, h, margin);
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fillStyle = '#f59e0b'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#92400e'; ctx.textAlign = 'center';
      ctx.fillText(lbl, px, py - 14);
    }
    if (data.intersection) {
      const { x, y, label: lbl } = data.intersection;
      const [px, py] = graphMapPt(x, y, data.xRange, data.yRange, w, h, margin);
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#065f46'; ctx.textAlign = 'center';
      ctx.fillText(lbl, px, py - 14);
    }
    label = data.finalLabel || '';
  }
  return label;
}

// ----- kind: solveReveal (ecuaciones 1er/2do grado: marcador que llega a la solución) -----
function drawSolveRevealFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const targets = data.targets;
  const allMin = Math.min(0, ...targets), allMax = Math.max(0, ...targets);
  const pad = ((allMax - allMin) || 1) * 0.3 || 2;
  const margin = 40;
  const y = drawNumberLineBase(ctx, w, h, allMin - pad, allMax + pad, margin);
  const perTarget = 10;
  let doneCount = 0;
  targets.forEach((t, i) => {
    const tStep = step - i * perTarget;
    const progress = Math.max(0, Math.min(tStep / perTarget, 1));
    if (progress <= 0) return;
    if (progress >= 1) doneCount++;
    const startX = nlMapX(0, allMin - pad, allMax + pad, w, margin);
    const targetX = nlMapX(t, allMin - pad, allMax + pad, w, margin);
    const markerX = startX + (targetX - startX) * progress;
    const settled = progress >= 1;
    ctx.beginPath();
    ctx.arc(markerX, y, settled ? 9 : 7, 0, Math.PI * 2);
    ctx.fillStyle = settled ? '#10b981' : '#f59e0b';
    ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    if (settled) {
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#065f46'; ctx.textAlign = 'center';
      const sub = targets.length > 1 ? ('x' + (i + 1)) : 'x';
      ctx.fillText(sub + ' = ' + t, markerX, y - 16);
    }
  });
  if (doneCount === targets.length) {
    return targets.length > 1 ? targets.map((t, i) => 'x' + (i + 1) + '=' + t).join(', ') : ('x = ' + targets[0]);
  }
  return 'Resolviendo...';
}

// ----- kind: euclid (MCD por cuadrados de Euclides) -----
function computeEuclidSquares(a, b) {
  const squares = [];
  let x = 0, y = 0, rw = a, rh = b;
  while (rw > 0 && rh > 0) {
    if (rw >= rh) {
      const count = Math.floor(rw / rh);
      for (let i = 0; i < count; i++) squares.push({ x: x + i * rh, y, size: rh });
      const rem = rw - count * rh;
      x += count * rh;
      rw = rem;
    } else {
      const count = Math.floor(rh / rw);
      for (let i = 0; i < count; i++) squares.push({ x, y: y + i * rw, size: rw });
      const rem = rh - count * rw;
      y += count * rw;
      rh = rem;
    }
  }
  return squares;
}

const EUCLID_PALETTE = [
  { fill: 'rgba(79,70,229,0.30)', stroke: '#4f46e5' },
  { fill: 'rgba(236,72,153,0.30)', stroke: '#ec4899' },
  { fill: 'rgba(245,158,11,0.30)', stroke: '#f59e0b' },
  { fill: 'rgba(16,185,129,0.30)', stroke: '#10b981' }
];

function drawEuclidFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const squares = computeEuclidSquares(data.a, data.b);
  const scale = Math.min((w - 60) / data.a, (h - 80) / data.b);
  const offsetX = (w - data.a * scale) / 2;
  const offsetY = 44;
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
  ctx.strokeRect(offsetX, offsetY, data.a * scale, data.b * scale);
  const revealed = Math.min(step, squares.length);
  const sizeColor = {};
  let colorIdx = 0;
  for (let i = 0; i < revealed; i++) {
    const sq = squares[i];
    if (!(sq.size in sizeColor)) { sizeColor[sq.size] = EUCLID_PALETTE[colorIdx % EUCLID_PALETTE.length]; colorIdx++; }
    const c = sizeColor[sq.size];
    const px = offsetX + sq.x * scale, py = offsetY + sq.y * scale, s = sq.size * scale;
    ctx.fillStyle = c.fill;
    ctx.fillRect(px, py, s, s);
    ctx.strokeStyle = c.stroke; ctx.lineWidth = 2;
    ctx.strokeRect(px, py, s, s);
  }
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center';
  ctx.fillText(data.a + ' × ' + data.b, w / 2, offsetY - 12);
  if (revealed >= squares.length) {
    const gcd = squares[squares.length - 1].size;
    ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#065f46';
    ctx.fillText('MCD = ' + gcd, w / 2, offsetY + data.b * scale + 24);
    return 'MCD(' + data.a + ', ' + data.b + ') = ' + gcd;
  }
  return 'Colocando cuadrados...';
}

// ----- kind: signSteps (potencias y signos: tarjetas con signo que se suman) -----
function drawSignStepsFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const terms = data.terms;
  const revealed = Math.min(step, terms.length);
  const tileW = Math.min(140, (w - 40) / terms.length - 10);
  const gap = (w - tileW * terms.length) / (terms.length + 1);
  const y = h / 2 - 30;
  let runningTotal = 0;
  for (let i = 0; i < terms.length; i++) {
    const x = gap + i * (tileW + gap);
    const isRevealed = i < revealed;
    const positive = terms[i].value >= 0;
    ctx.strokeStyle = isRevealed ? (positive ? '#10b981' : '#ef4444') : '#cbd5e1';
    ctx.lineWidth = 2;
    ctx.fillStyle = isRevealed ? (positive ? 'rgba(16,185,129,0.12)' : 'rgba(239,68,68,0.12)') : 'rgba(148,163,184,0.08)';
    ctx.fillRect(x, y, tileW, 60);
    ctx.strokeRect(x, y, tileW, 60);
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = isRevealed ? '#1e293b' : '#94a3b8';
    ctx.textAlign = 'center';
    ctx.fillText(terms[i].label, x + tileW / 2, y + 24);
    if (isRevealed) {
      ctx.fillStyle = positive ? '#065f46' : '#991b1b';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText((positive ? '+' : '') + terms[i].value, x + tileW / 2, y + 46);
      runningTotal += terms[i].value;
    }
  }
  ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#334155'; ctx.textAlign = 'center';
  ctx.fillText('Total: ' + runningTotal, w / 2, y + 90);
  return revealed >= terms.length ? ('Resultado = ' + runningTotal) : ('Sumando: ' + runningTotal + '...');
}

// ----- kind: polygonAngles (suma de ángulos interiores por triangulación) -----
function regularPolygonPoints(n, cx, cy, r) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = -Math.PI / 2 + i * (2 * Math.PI / n);
    pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
  }
  return pts;
}

function drawPolygonAnglesFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const n = data.n;
  const cx = w / 2, cy = h / 2 + 6, r = Math.min(w, h) / 2 - 40;
  const pts = regularPolygonPoints(n, cx, cy, r);
  ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 3;
  ctx.beginPath();
  pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.closePath(); ctx.stroke();
  pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = '#4f46e5'; ctx.fill(); });
  const triangleCount = n - 2;
  const revealed = Math.min(step, triangleCount);
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
  for (let i = 0; i < revealed; i++) {
    const [x1, y1] = pts[0];
    const [x2, y2] = pts[i + 2];
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center';
  ctx.fillText(revealed + ' triángulo' + (revealed === 1 ? '' : 's') + ' × 180° = ' + (revealed * 180) + '°', w / 2, h - 14);
  return revealed >= triangleCount ? ('Suma = ' + (triangleCount * 180) + '°') : ('Triangulando... ' + (revealed * 180) + '°');
}

// ----- utilidad compartida: construir un triángulo a partir de sus 3 lados -----
function triangleFromSides(a, b, c) {
  const P0 = [0, 0];
  const P1 = [a, 0];
  const cosA = (a * a + c * c - b * b) / (2 * a * c);
  const angleA = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const P2 = [c * Math.cos(angleA), c * Math.sin(angleA)];
  return [P0, P1, P2];
}

// ----- kind: perimeterTrace (perímetro: recorrer cada lado acumulando longitud) -----
function drawPerimeterTraceFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const [a, b, c] = data.sides;
  const pts = triangleFromSides(a, b, c);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min((w - 60) / (maxX - minX || 1), (h - 70) / (maxY - minY || 1));
  const offX = (w - (maxX - minX) * scale) / 2 - minX * scale;
  const offY = 20 - minY * scale;
  const toCanvas = ([x, y]) => [x * scale + offX, y * scale + offY];
  const cp = pts.map(toCanvas);
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
  ctx.beginPath();
  cp.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.closePath(); ctx.stroke();
  const edges = [[pts[0], pts[1], a], [pts[1], pts[2], b], [pts[2], pts[0], c]];
  const revealed = Math.min(step, 3);
  let total = 0;
  for (let i = 0; i < revealed; i++) {
    const [p1, p2, len] = edges[i];
    const [x1, y1] = toCanvas(p1), [x2, y2] = toCanvas(p2);
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#92400e'; ctx.textAlign = 'center';
    ctx.fillText(len + ' ' + data.unit, mx, my - 8);
    total += len;
  }
  ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center';
  ctx.fillText('Perímetro acumulado: ' + total + ' ' + data.unit, w / 2, h - 10);
  return revealed >= 3 ? ('Perímetro = ' + total + ' ' + data.unit) : ('Sumando lados... ' + total + ' ' + data.unit);
}

// ----- kind: rectAreaPerim (área por filas + perímetro del rectángulo) -----
function drawRectAreaPerimFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const bCells = data.base, hCells = data.height;
  const cell = Math.min((w - 60) / bCells, (h - 70) / hCells);
  const gw = cell * bCells, gh = cell * hCells;
  const offX = (w - gw) / 2, offY = 30;
  const rowsRevealed = Math.min(step, hCells);
  for (let r = 0; r < rowsRevealed; r++) {
    for (let c = 0; c < bCells; c++) {
      const x = offX + c * cell, y = offY + r * cell;
      ctx.fillStyle = 'rgba(79,70,229,0.15)';
      ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 1;
      ctx.fillRect(x, y, cell, cell); ctx.strokeRect(x, y, cell, cell);
    }
  }
  const showPerimeter = step > hCells;
  if (showPerimeter) {
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4;
    ctx.strokeRect(offX, offY, gw, gh);
  }
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center';
  ctx.fillText('Área: ' + (bCells * rowsRevealed) + ' ' + data.unit + '²', w / 2, offY + gh + 22);
  if (showPerimeter) {
    const perim = 2 * (bCells + hCells);
    ctx.fillStyle = '#92400e';
    ctx.fillText('Perímetro: ' + perim + ' ' + data.unit, w / 2, offY + gh + 40);
    return 'Área = ' + (bCells * hCells) + ' ' + data.unit + '², Perímetro = ' + perim + ' ' + data.unit;
  }
  return 'Rellenando fila ' + rowsRevealed + ' de ' + hCells + '...';
}

// ----- kind: metricLadder (sistema métrico: marcador bajando/subiendo la escalera de unidades) -----
const METRIC_UNITS = ['km', 'hm', 'dam', 'm', 'dm', 'cm', 'mm'];

function drawMetricLadderFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const fromIdx = METRIC_UNITS.indexOf(data.fromUnit);
  const toIdx = METRIC_UNITS.indexOf(data.toUnit);
  const n = METRIC_UNITS.length;
  const rowH = (h - 40) / n;
  const factorPerStep = data.direction === 'down' ? 10 : (1 / 10);
  METRIC_UNITS.forEach((u, i) => {
    const y = 20 + i * rowH + rowH / 2;
    const active = i === fromIdx || i === toIdx || (i > Math.min(fromIdx, toIdx) && i < Math.max(fromIdx, toIdx));
    ctx.font = (i === fromIdx || i === toIdx ? 'bold ' : '') + '13px sans-serif';
    ctx.fillStyle = active ? '#1e293b' : '#94a3b8';
    ctx.textAlign = 'left';
    ctx.fillText(u, 20, y + 4);
  });
  const stepsTotal = Math.abs(toIdx - fromIdx);
  const revealed = Math.min(step, stepsTotal);
  let currentValue = data.value;
  const dir = toIdx > fromIdx ? 1 : -1;
  for (let s = 0; s < revealed; s++) currentValue *= factorPerStep;
  currentValue = Math.round(currentValue * 10000) / 10000;
  const currentIdx = fromIdx + dir * revealed;
  const markerY = 20 + currentIdx * rowH + rowH / 2;
  const markerX = 90;
  ctx.beginPath(); ctx.arc(markerX, markerY, 8, 0, Math.PI * 2);
  ctx.fillStyle = revealed >= stepsTotal ? '#10b981' : '#f59e0b'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'left';
  ctx.fillText(currentValue + ' ' + METRIC_UNITS[currentIdx], markerX + 16, markerY + 5);
  return revealed >= stepsTotal
    ? (data.value + ' ' + data.fromUnit + ' = ' + currentValue + ' ' + data.toUnit)
    : ('Convirtiendo... ' + currentValue + ' ' + METRIC_UNITS[currentIdx]);
}

// ----- kind: triangleClassify (clasificación de triángulos por lados y ángulos) -----
function drawTriangleClassifyFrame(ctx, w, h, step, level) {
  const data = level.simular.data;
  const [a, b, c] = data.sides;
  const pts = triangleFromSides(a, b, c);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min((w - 60) / (maxX - minX || 1), (h - 90) / (maxY - minY || 1));
  const offX = (w - (maxX - minX) * scale) / 2 - minX * scale;
  const offY = 30 - minY * scale;
  const toC = ([x, y]) => [x * scale + offX, y * scale + offY];
  const cp = pts.map(toC);
  ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 3;
  ctx.beginPath(); cp.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)); ctx.closePath(); ctx.stroke();
  const edges = [[0, 1, a], [1, 2, b], [2, 0, c]];
  edges.forEach(([i, j, len]) => {
    const [x1, y1] = cp[i], [x2, y2] = cp[j];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#334155'; ctx.textAlign = 'center';
    ctx.fillText(len + ' ' + data.unit, mx, my - 6);
  });
  let label = 'Dibujando el triángulo...';
  if (step >= 2) {
    const counts = {};
    [a, b, c].forEach(v => counts[v] = (counts[v] || 0) + 1);
    edges.forEach(([i, j, len]) => {
      if (counts[len] > 1) {
        const [x1, y1] = cp[i], [x2, y2] = cp[j];
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L * 6, ny = dx / L * 6;
        ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mx - nx, my - ny); ctx.lineTo(mx + nx, my + ny); ctx.stroke();
      }
    });
    label = 'Marcando lados iguales...';
  }
  if (step >= 3) {
    const maxLen = Math.max(a, b, c);
    const edgeIdx = edges.findIndex(e => e[2] === maxLen);
    const oppVertexIdx = (edgeIdx + 2) % 3;
    const [x, y] = cp[oppVertexIdx];
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke();
    label = data.classification;
  }
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center';
  ctx.fillText(label, w / 2, h - 10);
  return label;
}

function renderStepPracticar(level) {
  const q = level.practicar;
  const letters = ['A', 'B', 'C', 'D'];
  return `
    <div class="lives-display">
      ${[1,2,3].map(i => `<span class="heart ${i > state.lives ? 'lost' : ''}">❤️</span>`).join('')}
    </div>
    <div class="question-text">${nl2br(q.question)}</div>
    <div class="options">
      ${q.options.map((opt, idx) => {
        let cls = 'option';
        if (state.currentQuestionAnswered) {
          if (idx === q.correct) cls += ' correct';
          else if (idx === state.selectedOption) cls += ' incorrect';
        }
        return `
          <button class="${cls}" onclick="selectOption(${idx})" ${state.currentQuestionAnswered ? 'disabled' : ''}>
            <span class="opt-letter">${letters[idx]}</span>
            <span>${opt}</span>
          </button>
        `;
      }).join('')}
    </div>
    ${state.currentQuestionAnswered ? renderFeedback(q) : ''}
    ${!state.currentQuestionAnswered ? `
      <div class="hint-area">
        <button class="hint-btn" onclick="showHint()">💡 Pista (-10 🪙)</button>
        <div class="hint-content" id="hint-content">${q.hint}</div>
      </div>
    ` : ''}
  `;
}

function renderFeedback(q) {
  const isCorrect = state.selectedOption === q.correct;
  return `
    <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
      <div class="feedback-title">${isCorrect ? '🎉 ¡Correcto!' : '❌ Incorrecto'}</div>
      <div>${q.explanation}</div>
    </div>
    <div class="step-nav-row" style="justify-content:flex-end;">
      <button class="btn" onclick="showResult()">Ver resultado →</button>
    </div>
  `;
}

function renderResult() {
  const stars = state.attempts === 1 ? 3 : state.attempts === 2 ? 2 : 1;
  return `
    <div class="result-screen">
      <div class="result-emoji">${stars === 3 ? '🏆' : stars === 2 ? '🎉' : '💪'}</div>
      <h2 class="result-title">${stars === 3 ? '¡Perfecto!' : stars === 2 ? '¡Muy bien!' : '¡Sigue practicando!'}</h2>
      <div class="result-stars">${[1,2,3].map(s => `<span class="${s <= stars ? 'star-filled' : 'star-empty'}">★</span>`).join('')}</div>
      <div class="result-stats">
        <div class="result-stat">
          <div class="result-stat-value">+${state.score}</div>
          <div class="result-stat-label">Puntos</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value">${state.attempts}</div>
          <div class="result-stat-label">Intentos</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value">${state.hintsUsed}</div>
          <div class="result-stat-label">Pistas usadas</div>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn secondary" onclick="goHome()">🏠 Inicio</button>
        <button class="btn secondary" onclick="goToIsland('${state.currentIsland}')">Volver a la isla</button>
        <button class="btn" onclick="continueToNext()">Continuar al siguiente reto →</button>
      </div>
    </div>
  `;
}

// ===================== ACTIONS =====================
function goHome() {
  state.currentScreen = 'home';
  state.currentIsland = null;
  state.currentLevel = null;
  render();
}

function goToIsland(islandId) {
  state.currentScreen = 'island';
  state.currentIsland = islandId;
  state.currentLevel = null;
  render();
}

function startLevel(islandId, levelId) {
  const island = gameData.find(i => i.id === islandId);
  const level = island ? island.levels.find(l => l.id === levelId) : null;
  state.currentScreen = 'level';
  state.currentIsland = islandId;
  state.currentLevel = levelId;
  state.currentStep = 'ver';
  state.entenderIdx = 0;
  state.formulaLegendOpen = false;
  state.lives = 3;
  state.score = 0;
  state.currentQuestionAnswered = false;
  state.selectedOption = null;
  state.hintsUsed = 0;
  state.attempts = 0;
  state.startTime = Date.now();
  if (level && level.interactive) {
    state.dragPool = level.interactive.items.map(it => it.id);
    state.dragOrder = new Array(level.interactive.items.length).fill(null);
    state.dragSolved = false;
  } else {
    state.dragPool = [];
    state.dragOrder = [];
    state.dragSolved = false;
  }
  render();
}

function nextStep() {
  if (state.currentStep === 'ver') {
    state.currentStep = 'entender';
    state.entenderIdx = 0;
  }
  render();
}

function entenderNext() {
  const level = getCurrentLevel();
  if (!level) return;
  const maxIdx = level.entender.steps.length;
  if (state.entenderIdx < maxIdx) state.entenderIdx++;
  state.formulaLegendOpen = false;
  render();
}

function entenderPrev() {
  if (state.entenderIdx === 0) return;
  state.entenderIdx--;
  state.formulaLegendOpen = false;
  render();
}

function toggleFormulaLegend() {
  state.formulaLegendOpen = !state.formulaLegendOpen;
  render();
}

function continueFromEntender() {
  const level = getCurrentLevel();
  state.currentStep = (level && level.simular) ? 'simular' : 'practicar';
  render();
}

function continueFromSimular() {
  state.currentStep = 'practicar';
  render();
}

function showResult() {
  state.currentScreen = 'result';
  render();
}

function selectOption(idx) {
  if (state.currentQuestionAnswered) return;
  state.selectedOption = idx;
  state.attempts++;
  const island = gameData.find(i => i.id === state.currentIsland);
  const level = island.levels.find(l => l.id === state.currentLevel);
  const isCorrect = idx === level.practicar.correct;
  if (isCorrect) {
    const points = Math.max(50, level.points - (state.attempts - 1) * 30 - state.hintsUsed * 10);
    state.score = points;
    state.coins += Math.floor(points / 20);
    state.totalScore += points;
    state.currentQuestionAnswered = true;
    const stars = state.attempts === 1 ? 3 : state.attempts === 2 ? 2 : 1;
    setLevelProgress(island.id, level.id, stars, points);
    saveState();
    if (stars === 3) launchConfetti();
  } else {
    state.lives--;
    if (state.lives <= 0) {
      state.currentQuestionAnswered = true;
    } else {
      setTimeout(() => {
        state.selectedOption = null;
        render();
      }, 800);
    }
  }
  render();
}

function showHint() {
  if (state.coins < 10) {
    showToast('❌ No tienes suficientes monedas (necesitas 10 🪙)', 'error');
    return;
  }
  state.coins -= 10;
  state.hintsUsed++;
  saveState();
  const hintContent = document.getElementById('hint-content');
  if (hintContent) hintContent.classList.add('show');
  updateStats();
}

function updateStats() {
  const stats = document.querySelector('.game-stats');
  if (stats) {
    stats.innerHTML = `
      <div class="stat-pill coins">🪙 ${state.coins}</div>
      <div class="stat-pill stars">⭐ ${state.totalScore}</div>
    `;
  }
}

function continueToNext() {
  const island = gameData.find(i => i.id === state.currentIsland);
  const currentIdx = island.levels.findIndex(l => l.id === state.currentLevel);
  if (currentIdx < island.levels.length - 1) {
    const nextLevel = island.levels[currentIdx + 1];
    if (isLevelUnlocked(island, currentIdx + 1)) {
      startLevel(island.id, nextLevel.id);
    } else {
      goToIsland(island.id);
    }
  } else {
    const islandIdx = gameData.findIndex(i => i.id === state.currentIsland);
    if (islandIdx < gameData.length - 1 && isIslandUnlocked(islandIdx + 1)) {
      goToIsland(gameData[islandIdx + 1].id);
    } else {
      goToIsland(island.id);
    }
  }
}

// ===================== UTILS =====================
function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function launchConfetti() {
  const colors = ['#4f46e5', '#ec4899', '#10b981', '#f59e0b', '#ef4444'];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// ===================== INIT =====================
render();
</script>
