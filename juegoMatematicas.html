<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathQuest — Aprende Matemáticas Jugando</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --accent: #ec4899;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
  background-attachment: fixed;
}
.app { max-width: 900px; margin: 0 auto; padding: 20px; min-height: 100vh; }

/* ===== HEADER ===== */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: white;
  border-radius: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #4f46e5, #ec4899);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4em;
  color: white;
}
.brand h1 { font-size: 1.3em; background: linear-gradient(135deg, #4f46e5, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.brand p { font-size: 0.75em; color: var(--muted); }
.game-stats { display: flex; gap: 12px; }
.stat-pill {
  background: var(--bg);
  padding: 8px 14px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9em;
  font-weight: 600;
}
.stat-pill.coins { color: var(--warning); }
.stat-pill.stars { color: var(--accent); }
.stat-pill.lives { color: var(--danger); }

/* ===== HOME / ISLAND MAP ===== */
.islands-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  margin-top: 20px;
}
.island-card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  border-top: 6px solid var(--island-color, var(--primary));
}
.island-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
.island-card.locked { opacity: 0.5; cursor: not-allowed; }
.island-icon-large {
  width: 80px; height: 80px;
  background: var(--island-color, var(--primary));
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5em;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  color: white;
}
.island-card h3 { font-size: 1.2em; margin-bottom: 6px; }
.island-card .subtitle { color: var(--muted); font-size: 0.85em; margin-bottom: 14px; }
.island-progress { background: var(--bg); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.island-progress-fill { height: 100%; background: var(--island-color, var(--primary)); transition: width 0.5s; }
.island-progress-text { font-size: 0.8em; color: var(--muted); display: flex; justify-content: space-between; }

/* ===== ISLAND VIEW (LEVELS) ===== */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  color: var(--muted);
  font-size: 0.9em;
}
.breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  margin-top: 20px;
}
.level-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--shadow);
  border: 2px solid transparent;
  position: relative;
}
.level-card:hover:not(.locked) { transform: translateY(-3px); border-color: var(--island-color, var(--primary)); }
.level-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); }
.level-card.completed { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-color: var(--success); }
.level-num {
  font-size: 1.8em;
  font-weight: 700;
  color: var(--island-color, var(--primary));
  margin-bottom: 4px;
}
.level-title { font-size: 0.85em; color: var(--text); font-weight: 500; margin-bottom: 8px; }
.level-stars { font-size: 0.9em; letter-spacing: 2px; }
.level-stars .star-empty { color: #d1d5db; }
.level-stars .star-filled { color: #fbbf24; }
.level-badge {
  position: absolute;
  top: 8px; right: 8px;
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 0.7em;
  font-weight: 600;
  color: var(--muted);
}
.level-badge.basic { background: #d1fae5; color: #047857; }
.level-badge.intermediate { background: #fef3c7; color: #b45309; }
.level-badge.advanced { background: #fee2e2; color: #b91c1c; }

/* ===== LEVEL PLAY ===== */
.level-screen { background: white; border-radius: 20px; box-shadow: var(--shadow); padding: 30px; }
.step-indicator {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}
.step-side-btn { flex-shrink: 0; white-space: nowrap; }
.step-pills {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  flex: 1;
}
.step-dot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--bg);
  font-size: 0.85em;
  color: var(--muted);
  font-weight: 500;
  transition: all 0.3s;
  cursor: pointer;
}
.step-dot:hover:not(.active) { background: var(--border); }
.step-dot.active { background: var(--primary); color: white; }
.step-dot.completed { background: var(--success); color: white; }
.step-dot .step-icon { font-size: 1.1em; }

.step-content { min-height: 400px; }
.step-title { font-size: 1.5em; margin-bottom: 12px; color: var(--text); }
.step-subtitle { color: var(--muted); margin-bottom: 20px; }

/* VER step */
.visual-box {
  background: linear-gradient(135deg, #eef2ff 0%, #fae8ff 100%);
  border: 2px dashed var(--primary);
  border-radius: 16px;
  padding: 30px;
  margin: 20px 0;
  text-align: center;
  font-size: 1.4em;
  font-weight: 500;
  color: var(--primary-dark);
}
.visual-highlight { color: var(--accent); font-weight: 700; }

/* Diagrama de figuras (nivel insignia) */
.fig-diagram { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
.fig-card { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 14px 18px; text-align: center; }
.fig-svg svg { width: 130px; height: auto; display: block; }
.fig-svg.large svg { width: 220px; height: auto; display: block; }
.fig-label { margin-top: 8px; font-size: 0.85em; font-weight: 600; color: var(--muted); }

/* Actividad de arrastrar */
.drag-activity { margin-top: 24px; background: var(--bg); border-radius: 16px; padding: 18px; }
.drag-instructions { font-weight: 600; margin-bottom: 14px; text-align: center; }
.drag-slots { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
.drag-slot {
  width: 120px; min-height: 120px;
  border: 2px dashed var(--border);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  background: white;
}
.drag-slot.filled { border-style: solid; border-color: var(--primary); background: #eef2ff; }
.drag-slot .slot-label {
  position: absolute; top: 4px; left: 8px;
  font-size: 0.7em; color: var(--muted); font-weight: 700;
}
.drag-pool { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; min-height: 110px; }
.drag-item {
  touch-action: none; cursor: grab;
  width: 100px; height: 100px;
  background: white;
  border: 2px solid var(--primary);
  border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  user-select: none;
}
.drag-item .fig-svg svg { width: 70px; }
.drag-item .fig-label { font-size: 0.7em; margin-top: 4px; }
.drag-item.dragging { opacity: 0.35; }
.drag-ghost-el { position: fixed; z-index: 9999; pointer-events: none; }
.drag-feedback { margin-top: 14px; text-align: center; font-weight: 700; font-size: 1.05em; }
.drag-feedback.ok { color: var(--success); }

/* ENTENDER step */
.explanation-list { display: flex; flex-direction: column; gap: 12px; margin: 18px 0; }

.explanation-step-big {
  background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%);
  border: 2px solid var(--primary);
  border-radius: 18px;
  padding: 30px 26px;
  font-size: 1.3em;
  line-height: 1.6;
  min-height: 110px;
  display: flex;
  align-items: center;
  gap: 18px;
  animation: slideUp 0.3s;
}
.explanation-step-done {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 0.92em;
  line-height: 1.5;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideUp 0.3s;
}
.step-num-badge {
  flex-shrink: 0;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 1.15em;
}
.step-num-badge.small {
  width: 26px; height: 26px;
  font-size: 0.75em;
  background: var(--success);
}

.step-nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

.step-arrow-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: white;
  font-size: 1.5em;
  font-weight: 700;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(79,70,229,0.35);
  transition: all 0.2s;
}
.step-arrow-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 6px 18px rgba(79,70,229,0.45); }
.step-arrow-btn:disabled { background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; opacity: 0.6; }

.formula-card {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border: 1px solid var(--warning);
  border-radius: 16px;
  padding: 20px 22px;
  margin: 16px 0;
}
.formula-label {
  font-weight: 700;
  color: #92400e;
  text-transform: uppercase;
  font-size: 0.78em;
  letter-spacing: 0.04em;
  text-align: center;
  margin-bottom: 10px;
}
.formula-expr {
  text-align: center;
  font-size: 1.3em;
  font-weight: 600;
  cursor: pointer;
  border-radius: 10px;
  padding: 8px;
  transition: background 0.2s;
}
.formula-expr:hover { background: rgba(255,255,255,0.35); }
.formula-toggle-hint {
  display: block;
  font-size: 0.5em;
  font-weight: 600;
  color: #92400e;
  text-transform: none;
  letter-spacing: normal;
  margin-top: 8px;
}
.formula-legend { list-style: none; margin-top: 14px; display: grid; gap: 8px; text-align: left; }
.formula-legend li { background: rgba(255,255,255,0.65); border-radius: 10px; padding: 10px 16px; font-size: 0.95em; }
.formula-legend .sym { font-weight: 700; color: var(--primary-dark); margin-right: 6px; }

.robotica-card {
  background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
  border: 1px solid #10b981;
  border-radius: 16px;
  padding: 16px 20px;
  margin: 16px 0;
  text-align: left;
  font-size: 0.92em;
  color: #065f46;
}
.robotica-card strong { display: block; margin-bottom: 4px; font-size: 0.95em; }

/* SIMULAR step */
.sim-wrap { text-align: center; margin: 16px 0; }
.sim-canvas { width: 100%; max-width: 600px; height: 180px; background: linear-gradient(180deg, #eef2ff, #ffffff); border-radius: 16px; border: 2px solid var(--border); }
.sim-counter { font-size: 1.3em; font-weight: 700; margin-top: 12px; color: var(--primary-dark); }

/* PRACTICAR step */
.question-text {
  font-size: 1.2em;
  margin-bottom: 24px;
  padding: 20px;
  background: var(--bg);
  border-radius: 12px;
  border-left: 4px solid var(--primary);
}
.options { display: grid; gap: 12px; }
.option {
  background: white;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 1.05em;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}
.option:hover:not(:disabled) { border-color: var(--primary); background: #f5f3ff; transform: translateX(4px); }
.option .opt-letter {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
}
.option.correct { background: linear-gradient(135deg, #d1fae5, #a7f3d0); border-color: var(--success); color: #065f46; }
.option.correct .opt-letter { background: var(--success); color: white; }
.option.incorrect { background: linear-gradient(135deg, #fee2e2, #fecaca); border-color: var(--danger); color: #991b1b; }
.option.incorrect .opt-letter { background: var(--danger); color: white; }
.option:disabled { cursor: not-allowed; }

.feedback {
  margin-top: 20px;
  padding: 16px 20px;
  border-radius: 12px;
  animation: slideUp 0.3s;
}
.feedback.correct { background: linear-gradient(135deg, #d1fae5, #a7f3d0); border-left: 4px solid var(--success); color: #065f46; }
.feedback.incorrect { background: linear-gradient(135deg, #fee2e2, #fecaca); border-left: 4px solid var(--danger); color: #991b1b; }
.feedback-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.lives-display {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 16px;
  font-size: 1.5em;
}
.heart { transition: all 0.3s; }
.heart.lost { opacity: 0.2; transform: scale(0.8); }

.hint-area { margin-top: 20px; }
.hint-btn {
  background: var(--warning);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.95em;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.hint-btn:hover { background: #d97706; }
.hint-content {
  background: #fffbeb;
  border: 1px solid var(--warning);
  border-radius: 12px;
  padding: 14px 18px;
  margin-top: 10px;
  color: #92400e;
  display: none;
}
.hint-content.show { display: block; animation: slideUp 0.3s; }

.btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1em;
  font-weight: 600;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
.btn:disabled { background: var(--muted); cursor: not-allowed; opacity: 0.6; }
.btn.secondary { background: var(--bg); color: var(--text); }
.btn.secondary:hover:not(:disabled) { background: var(--border); }
.btn.success { background: var(--success); }
.btn.danger { background: var(--danger); }

.level-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* ===== RESULT SCREEN ===== */
.result-screen {
  background: white;
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 40px;
  text-align: center;
}
.result-emoji { font-size: 5em; margin-bottom: 16px; animation: bounce 0.6s; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
.result-title { font-size: 2em; margin-bottom: 8px; }
.result-stars { font-size: 3em; margin: 16px 0; letter-spacing: 6px; }
.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 24px 0;
}
.result-stat {
  background: var(--bg);
  padding: 16px;
  border-radius: 12px;
}
.result-stat-value { font-size: 1.8em; font-weight: 700; color: var(--primary); }
.result-stat-label { font-size: 0.85em; color: var(--muted); }
.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }

/* ===== CONFETTI ===== */
.confetti { position: fixed; width: 10px; height: 10px; pointer-events: none; animation: confetti-fall 3s linear forwards; }
@keyframes confetti-fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: white;
  border-radius: 12px;
  padding: 14px 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  z-index: 1000;
  animation: slideIn 0.3s, slideOut 0.3s 2.7s;
  border-left: 4px solid var(--primary);
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
@keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideOut { to { opacity: 0; transform: translateX(100px); } }

/* ===== UTIL ===== */
.text-center { text-align: center; }
.mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 24px; }
.mb-1 { margin-bottom: 8px; } .mb-2 { margin-bottom: 16px; } .mb-3 { margin-bottom: 24px; }
.hidden { display: none; }

.welcome-banner {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
  color: white;
  padding: 30px;
  border-radius: 20px;
  margin-bottom: 20px;
  text-align: center;
}
.welcome-banner h2 { font-size: 1.8em; margin-bottom: 8px; }
.welcome-banner p { opacity: 0.95; }

@media (max-width: 600px) {
  .app { padding: 12px; }
  .level-screen { padding: 20px; }
  .step-dot { padding: 6px 10px; font-size: 0.75em; }
  .game-stats .stat-pill { padding: 6px 10px; font-size: 0.8em; }
  .brand h1 { font-size: 1.1em; }
  .result-stats { grid-template-columns: 1fr; }
  .explanation-step-big { font-size: 1.05em; padding: 20px 18px; }
  .explanation-step-done { font-size: 0.85em; padding: 10px 14px; }
  .step-side-btn { padding: 8px 14px; font-size: 0.8em; }
  .fig-svg svg { width: 90px; }
  .fig-svg.large svg { width: 160px; }
  .drag-item { width: 80px; height: 80px; }
  .drag-slot { width: 90px; min-height: 90px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ===================== DATA: 26 NIVELES =====================
const gameData = [
  {
    id: 'algebra',
    name: 'Sentido Numérico y Algebraico',
    icon: '🧮',
    color: '#4f46e5',
    description: '10 niveles — Ecuaciones, sucesiones, fracciones, sistemas',
    levels: [
      {
        id: 'MAT_28',
        title: 'Progresiones Aritméticas',
        robotica: 'Las progresiones aritméticas son la base de la programación en Arduino, ESP32, Lego y Abilix Krypton: permiten estructurar bucles, controlar servomotores paso a paso y construir rutinas repetitivas de movimiento.',
        difficulty: 'basic',
        points: 100,
        diagram: 'progresion-palillos',
        ver: {
          title: '👀 Observa las figuras de palillos',
          content: 'Cada figura se construye agregando un cuadrado más, en una fila. ¿Cuántos palillos tendrá la Figura 4?',
          description: 'Cuenta los palillos de cada figura. ¿Ves un patrón en cómo va creciendo?'
        },
        interactive: {
          instructions: 'Arrastra cada tarjeta a su casillero, ordenando las figuras de la que tiene MENOS palillos a la que tiene MÁS. ¡Cuenta los cuadraditos de cada una!',
          items: [
            { id: 0, squares: 3 },
            { id: 1, squares: 1 },
            { id: 2, squares: 4 },
            { id: 3, squares: 2 }
          ],
          correctOrder: [1, 3, 0, 2]
        },
        entender: {

// ===================== GAME STATE =====================
let state = {
  currentScreen: 'home',  // home | island | level | result
  currentIsland: null,
  currentLevel: null,
  currentStep: 'ver',  // ver | entender | simular | practicar
  entenderIdx: 0,
  formulaLegendOpen: false,
  lives: 3,
  score: 0,
  totalScore: parseInt(localStorage.getItem('mathquest-totalScore') || '0'),
  coins: parseInt(localStorage.getItem('mathquest-coins') || '0'),
  progress: JSON.parse(localStorage.getItem('mathquest-progress') || '{}'),
  currentQuestionAnswered: false,
  selectedOption: null,
  hintsUsed: 0,
  attempts: 0,
  startTime: null,
  dragPool: [],
  dragOrder: [],
  dragSolved: false
};

function saveState() {
  localStorage.setItem('mathquest-totalScore', String(state.totalScore));
  localStorage.setItem('mathquest-coins', String(state.coins));
  localStorage.setItem('mathquest-progress', JSON.stringify(state.progress));
}

function getCurrentLevel() {
  const island = gameData.find(i => i.id === state.currentIsland);
  if (!island) return null;
  return island.levels.find(l => l.id === state.currentLevel) || null;
}

function getLevelProgress(islandId, levelId) {
  return state.progress[islandId]?.[levelId] || null;
}

function setLevelProgress(islandId, levelId, stars, points) {
  if (!state.progress[islandId]) state.progress[islandId] = {};
  const existing = state.progress[islandId][levelId];
  if (!existing || stars > existing.stars) {
    state.progress[islandId][levelId] = { stars, points, completedAt: Date.now() };
    saveState();
  }
}

// ===== MODO REVISIÓN =====
// Mientras REVIEW_MODE = true: todos los niveles e islas están desbloqueados
// para que se pueda revisar cualquier contenido sin restricción.
// Las estrellas y el progreso SOLO se guardan cuando se responde correctamente.
const REVIEW_MODE = true;

function isLevelUnlocked(island, levelIndex) {
  if (REVIEW_MODE) return true;
  if (levelIndex === 0) return true;
  const prevLevel = island.levels[levelIndex - 1];
  return getLevelProgress(island.id, prevLevel.id) !== null;
}

function isIslandUnlocked(islandIndex) {
  if (REVIEW_MODE) return true;
  if (islandIndex === 0) return true;
  const prevIsland = gameData[islandIndex - 1];
  const completed = prevIsland.levels.filter(l => getLevelProgress(prevIsland.id, l.id)).length;
  return completed >= Math.ceil(prevIsland.levels.length * 0.5);
}

function getIslandProgress(island) {
  const completed = island.levels.filter(l => getLevelProgress(island.id, l.id)).length;
  return { completed, total: island.levels.length, percent: Math.round((completed / island.levels.length) * 100) };
}

function nl2br(text) {
  return String(text).replace(/\n/g, '<br>');
}

// ===================== RENDERERS =====================
function render() {
  const app = document.getElementById('app');
  let html = renderHeader();
  if (state.currentScreen === 'home') html += renderHome();
  else if (state.currentScreen === 'island') html += renderIsland();
  else if (state.currentScreen === 'level') html += renderLevel();
  else if (state.currentScreen === 'result') html += renderResult();
  app.innerHTML = html;
  if (state.currentScreen === 'level' && state.currentStep === 'simular') {
    const level = getCurrentLevel();
    if (level && level.simular) simDraw(level, SIM_REGISTRY[level.simular.kind].initFrame);
  }
}

  const island = gameData.find(i => i.id === state.currentIsland);
  if (!island) return '<p>Isla no encontrada</p>';
  const prog = getIslandProgress(island);
  let html = `
    <div class="breadcrumb">
      <a onclick="goHome()">🏠 Inicio</a>
      <span>›</span>
      <span>${island.icon} ${island.name}</span>

    <div class="level-screen" style="--island-color: ${island.color}; border-top: 6px solid ${island.color};">
      <h2 style="color: ${island.color};">${island.icon} ${island.name}</h2>
      <p class="step-subtitle">${island.description} • Progreso: ${prog.completed}/${prog.total}</p>
      <div class="levels-grid">
  `;
  island.levels.forEach((level, idx) => {
    const lvlProg = getLevelProgress(island.id, level.id);
    const unlocked = isLevelUnlocked(island, idx);
    const stars = lvlProg ? lvlProg.stars : 0;
    html += `
      <div class="level-card ${unlocked ? '' : 'locked'} ${lvlProg ? 'completed' : ''}"
           onclick="${unlocked ? `startLevel('${island.id}', '${level.id}')` : ''}">

        <div class="level-title">${level.title}</div>

  return html;
}

  if (!level) return '<p>Nivel no encontrado</p>';

  let stepContent = '';
  if (state.currentStep === 'ver') stepContent = renderStepVer(level);
  else if (state.currentStep === 'entender') stepContent = renderStepEntender(level);
  else if (state.currentStep === 'simular') stepContent = renderStepSimular(level);
  else if (state.currentStep === 'practicar') stepContent = renderStepPracticar(level);

  const hasSimular = !!level.simular;
  const stepOrder = ['ver', 'entender'].concat(hasSimular ? ['simular'] : []).concat(['practicar']);
  const idxCurrent = stepOrder.indexOf(state.currentStep);
  const dotClass = (name) => {
    const idxName = stepOrder.indexOf(name);
    if (idxName === idxCurrent) return 'active';
    if (idxName < idxCurrent) return 'completed';
    return '';
  };

  const backEnabled = canGoBack();
  return `
    <div class="breadcrumb">
      <a onclick="goHome()">🏠 Inicio</a>
      <span>›</span>
      <a onclick="goToIsland('${island.id}')">${island.icon} ${island.name}</a>
      <span>›</span>
      <span>${level.title}</span>
    </div>
    <div class="level-screen" style="--island-color: ${island.color};">
      <div class="step-indicator">
        <button class="btn secondary step-side-btn" onclick="goToPreviousLevel()" ${backEnabled ? '' : 'style="visibility:hidden;" disabled'}>← Nivel anterior</button>

          <div class="step-dot ${dotClass('ver')}" onclick="goToLevelStep('ver')"><span class="step-icon">👀</span> Ver</div>

          <div class="step-dot ${dotClass('practicar')}" onclick="goToLevelStep('practicar')"><span class="step-icon">✍️</span> Practicar</div>
        </div>
        <button class="btn secondary step-side-btn" onclick="goToIsland('${island.id}')">🚪 Salir al mapa</button>
      </div>
      <div class="step-content">${stepContent}</div>
    </div>
  `;
}

function getPrevLevelInIsland() {
  const island = gameData.find(i => i.id === state.currentIsland);
  if (!island) return null;
  const idx = island.levels.findIndex(l => l.id === state.currentLevel);
  if (idx <= 0) return null;
  return { island, level: island.levels[idx - 1] };
}

function canGoBack() {
  return getPrevLevelInIsland() !== null;
}

function goToPreviousLevel() {
  const prev = getPrevLevelInIsland();
  if (!prev) return;
  startLevel(prev.island.id, prev.level.id);
}

function goToLevelStep(stepName) {
  const level = getCurrentLevel();
  if (!level) return;
  if (stepName === 'simular' && !level.simular) return;
  if (stepName === state.currentStep) return;
  state.currentStep = stepName;
  render();
}

function renderStepVer(level) {

function renderMiniFigureSVG(n, maxN) {
  const squareSize = 26;
  const refN = Math.max(maxN || n, n);
  const width = squareSize * refN + 10;
  let lines = '';
  for (let i = 0; i < n; i++) {
    const x = 5 + i * squareSize;
    if (i === 0) lines += `<line x1="${x}" y1="4" x2="${x}" y2="${4 + squareSize}" stroke="#4f46e5" stroke-width="2"/>`;
    lines += `<line x1="${x + squareSize}" y1="4" x2="${x + squareSize}" y2="${4 + squareSize}" stroke="#4f46e5" stroke-width="2"/>`;
    lines += `<line x1="${x}" y1="4" x2="${x + squareSize}" y2="4" stroke="#4f46e5" stroke-width="2"/>`;
    lines += `<line x1="${x}" y1="${4 + squareSize}" x2="${x + squareSize}" y2="${4 + squareSize}" stroke="#4f46e5" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 ${width} ${squareSize + 8}" xmlns="http://www.w3.org/2000/svg">${lines}</svg>`;
}

function renderProgresionDiagram() {
  const figs = [1, 2, 3];
  const maxN = Math.max(...figs);
  return `
    <div class="fig-diagram">
      ${figs.map(n => `
        <div class="fig-card">
          <div class="fig-svg">${renderMiniFigureSVG(n, maxN)}</div>
          <div class="fig-label">Figura ${n} (${4 + (n - 1) * 3} palillos)</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTriangleSVG(sides) {

      <text x="110" y="167" font-size="14" fill="#92400e" text-anchor="middle">${sides[0]}</text>

function renderRectangleSVG(base, height) {

      <text x="110" y="130" font-size="14" fill="#3730a3" text-anchor="middle">base = ${base}</text>
      <text x="14" y="65" font-size="14" fill="#3730a3" text-anchor="middle" transform="rotate(-90 14 65)">altura = ${height}</text>
